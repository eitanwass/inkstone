    <path d="M10 2.2l1.2 1.9 2.2-.5.9 2.1 2.1.9-.5 2.2 1.9 1.2-1.9 1.2.5 2.2-2.1.9-.9 2.1-2.2-.5L10 17.8l-1.2-1.9-2.2.5-.9-2.1-2.1-.9.5-2.2L2.2 10l1.9-1.2-.5-2.2 2.1-.9.9-2.1 2.2.5z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
