<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-undo" viewBox="0 0 20 20">
    <path d="M7 5L3 9l4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 9h9a4 4 0 1 1 0 8h-2" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-redo" viewBox="0 0 20 20">
    <path d="M13 5l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 9H8a4 4 0 1 0 0 8h2" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-reset-view" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.4" fill="none"/>
    <path d="M10 1v3M10 16v3M1 10h3M16 10h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-clear" viewBox="0 0 20 20">
    <path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-export" viewBox="0 0 20 20">
    <path d="M10 3v9M6.5 9L10 12.5 13.5 9" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 15h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-select" viewBox="0 0 20 20">
    <path d="M4 2l12 8-6 1-3 6z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-room" viewBox="0 0 20 20">
    <rect x="3" y="5" width="14" height="10" stroke="currentColor" stroke-width="1.4" fill="none" rx="1"/>
  </symbol>

  <symbol id="icon-wall" viewBox="0 0 20 20">
    <line x1="3" y1="17" x2="17" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-token" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.4" fill="none"/>
    <circle cx="10" cy="10" r="2.5" fill="currentColor" opacity="0.5"/>
  </symbol>

  <symbol id="icon-label" viewBox="0 0 20 20">
    <text x="4" y="15" font-size="13" fill="currentColor" font-family="serif" font-weight="bold">A</text>
  </symbol>

  <symbol id="icon-erase" viewBox="0 0 20 20">
    <g transform="rotate(-30 10 10)">
      <rect x="3" y="7" width="14" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4" fill="none"/>
      <line x1="3" y1="11" x2="17" y2="11" stroke="currentColor" stroke-width="1.4"/>
    </g>
  </symbol>

  <symbol id="icon-plus" viewBox="0 0 20 20">
    <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-share" viewBox="0 0 20 20">
    <circle cx="5" cy="10" r="2.2" stroke="currentColor" stroke-width="1.4" fill="none"/>
    <circle cx="15" cy="5" r="2.2" stroke="currentColor" stroke-width="1.4" fill="none"/>
    <circle cx="15" cy="15" r="2.2" stroke="currentColor" stroke-width="1.4" fill="none"/>
    <path d="M7 9l6-3M7 11l6 3" stroke="currentColor" stroke-width="1.4"/>
  </symbol>

  <symbol id="icon-join" viewBox="0 0 20 20">
    <path d="M8 12a3.5 3.5 0 0 0 5 0l2-2a3.5 3.5 0 0 0-5-5l-1 1" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 8a3.5 3.5 0 0 0-5 0l-2 2a3.5 3.5 0 0 0 5 5l1-1" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
