  <!-- Right rail, top-right: the action cluster (the map's own actions), then the live session in a panel of its
       own: the Live indicator and who is here (while shared), then the buttons to share or join. -->
  <div id="right-rail">
    <!-- Action cluster: undo/redo/view controls, top-right -->
    <div id="action-cluster" class="floating-panel" role="toolbar" aria-label="Map actions">
      <!-- Whether the map is saved in this browser (see showSaveStatus in src/input/history.ts) -->
      <span id="save-status" role="img" aria-label="Saved" title="Saved" data-state="saved">
        <svg class="save-icon save-saving" width="10" height="10" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="20 12"/></svg>
        <svg class="save-icon save-saved" width="10" height="10" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="save-icon save-failed" width="10" height="10" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <button class="icon-btn" id="btn-undo" aria-label="Undo" aria-keyshortcuts="Control+Z" title="Undo (Ctrl+Z)">
        <svg width="18" height="18"><use href="/icons.svg#icon-undo"></use></svg>
      </button>
      <button class="icon-btn" id="btn-redo" aria-label="Redo" aria-keyshortcuts="Control+Shift+Z Control+Y" title="Redo (Ctrl+Shift+Z)">
        <svg width="18" height="18"><use href="/icons.svg#icon-redo"></use></svg>
      </button>
      <button class="icon-btn" id="btn-more" aria-label="More actions" aria-expanded="false" aria-controls="action-cluster" title="More actions">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <!-- Beside undo/redo on wide screens; a dropdown under the "more" button on phones. -->
      <div id="action-more" class="floating-panel">
      <div class="panel-divider"></div>
      <!-- Reset view lives with the zoom controls (bottom-left); phones have no zoom panel, so it is here for them -->
      <button class="icon-btn phone-only" id="btn-reset-view-phone" data-action="reset-view" aria-label="Reset view" title="Reset view (Home)">
        <svg width="18" height="18"><use href="/icons.svg#icon-reset-view"></use></svg>
      </button>
      <button class="icon-btn" id="btn-clear" aria-label="Clear all elements" title="Clear all elements">
        <svg width="18" height="18"><use href="/icons.svg#icon-clear"></use></svg>
      </button>
      <button class="icon-btn" id="btn-export" aria-label="Export as PNG" title="Export as PNG">
        <svg width="18" height="18"><use href="/icons.svg#icon-export"></use></svg>
      </button>
      <button class="icon-btn" id="btn-save-file" aria-label="Save map to a file" title="Save map to a file">
        <svg width="18" height="18"><use href="/icons.svg#icon-save-file"></use></svg>
      </button>
      <button class="icon-btn" id="btn-open-file" aria-label="Open map from a file" title="Open map from a file">
        <svg width="18" height="18"><use href="/icons.svg#icon-open-file"></use></svg>
      </button>
      <input type="file" id="open-file-input" accept=".json,application/json" hidden>
      <div class="panel-divider"></div>
      <button class="icon-btn" id="btn-changelog" aria-label="What's new" aria-haspopup="dialog" title="What's new">
        <svg width="18" height="18"><use href="/icons.svg#icon-changelog"></use></svg>
      </button>
      <button class="icon-btn" id="btn-feedback" aria-label="Send feedback" aria-haspopup="dialog" title="Send feedback">
        <svg width="18" height="18"><use href="/icons.svg#icon-feedback"></use></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings" aria-haspopup="dialog" title="Settings">
        <svg width="18" height="18"><use href="/icons.svg#icon-settings"></use></svg>
      </button>
      </div>
    </div>
    <!-- The live session, apart from the map's actions: while shared, the Live indicator and everyone connected
         (one round sigil each, src/ui/players.tsx); always, the buttons to share this map or join another's -->
    <div id="session" class="floating-panel" role="group" aria-label="Live session">
      <div id="collab-status" class="hidden" role="status" data-state="live">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="collab-status-text">Live</span>
        <span id="collab-count" class="visually-hidden"></span>
      </div>
      <ul id="players" aria-label="Players connected"></ul>
      <div class="panel-divider session-divider"></div>
      <button class="icon-btn" id="btn-share" aria-label="Share this map" aria-haspopup="dialog" aria-expanded="false" title="Share this map (live co-editing)">
        <svg width="18" height="18"><use href="/icons.svg#icon-share"></use></svg>
      </button>
      <button class="icon-btn" id="btn-join" aria-label="Join a shared map" aria-haspopup="dialog" aria-expanded="false" title="Connect to another session">
        <svg width="18" height="18"><use href="/icons.svg#icon-join"></use></svg>
      </button>
    </div>
  </div>
