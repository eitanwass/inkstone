  <!-- The token card: details of the selected token, above it (see src/ui/token-card.ts): its name, color,
       image and conditions so far; HP and AC are meant to go here too. -->
  <div id="token-card" class="hidden" role="group" aria-label="Token details">
    <input id="token-name-field" type="text" maxlength="20" placeholder="Name" aria-label="Token name" autocomplete="off" spellcheck="false" enterkeyhint="done" />
    <!-- The name's style: bold, italic and a plate behind it (built in src/ui/text-style-toggles.ts, shared with the label card) -->
    <div id="token-text-style" class="ts-toggles" role="group" aria-label="Name style"></div>
    <!-- Color: the token palette as swatches (built in src/ui/token-card.ts), then any color -->
    <div id="token-colors" role="group" aria-label="Token color">
      <label class="token-swatch token-swatch-custom" title="Custom color">
        <input type="color" id="token-color-custom" aria-label="Custom color" />
      </label>
    </div>
    <!-- Image: a picture shown in the disc (cropped to a square and shrunk, see src/elements/token-image.ts) -->
    <div id="token-image" role="group" aria-label="Token image">
      <span class="tc-label">Image</span>
      <button type="button" id="token-image-pick" class="tc-add" aria-label="Add image">
        <span id="token-image-text">+ Add</span>
        <img id="token-image-preview" alt="" hidden />
        <svg class="tc-pencil" width="14" height="14" aria-hidden="true"><use href="/icons.svg#icon-edit"></use></svg>
      </button>
      <button type="button" id="token-image-remove" class="tc-remove" aria-label="Remove image" title="Remove image" hidden>
        <svg width="10" height="10" aria-hidden="true"><use href="/icons.svg#icon-close"></use></svg>
      </button>
      <input type="file" id="token-image-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
    </div>
    <!-- Conditions: the ones it has as removable pills, and a picker of all the ones to choose from -->
    <div id="token-conditions" role="group" aria-label="Token conditions">
      <div class="tc-head">
        <span class="tc-label">Conditions</span>
        <button type="button" id="token-cond-add" class="tc-add" aria-expanded="false" aria-controls="token-cond-picker">+ Add</button>
      </div>
      <div id="token-cond-pills" class="tc-pills"></div>
      <div id="token-cond-picker" class="tc-picker" hidden>
        <input type="text" id="token-cond-filter" placeholder="Type to filter" aria-label="Filter conditions" autocomplete="off" spellcheck="false" />
        <div id="token-cond-grid" class="tc-grid" role="group" aria-label="Conditions to choose from"></div>
      </div>
    </div>
  </div>

  <!-- Hovering a token with conditions lists them by name (see updateConditionsTip in src/ui/token-card.ts) -->
  <div id="token-tip" class="hidden" role="tooltip"></div>

  <!-- The measurement on screen (ruler distance, or the size of the shape being drawn), as text:
       the canvas draws it, this lets screen readers and the tests read it. -->
  <p id="measure-readout" class="visually-hidden"></p>
