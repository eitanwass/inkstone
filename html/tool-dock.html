  <!-- Tool dock, bottom-center -->
  <div id="tool-dock" class="floating-panel" role="toolbar" aria-label="Tools">
    <button class="tool-btn active" id="tool-select" aria-label="Select and move" aria-pressed="true" aria-keyshortcuts="V" data-tool="select" title="Select & Move (V)">
      <svg width="20" height="20"><use href="/icons.svg#icon-select"></use></svg>
    </button>
    <button class="tool-btn" id="tool-rect" aria-label="Rectangle room" aria-pressed="false" aria-keyshortcuts="R" data-tool="rect" title="Rectangle Room (R)">
      <svg width="20" height="20"><use href="/icons.svg#icon-room"></use></svg>
    </button>
    <button class="tool-btn" id="tool-wall" aria-label="Draw wall" aria-pressed="false" aria-keyshortcuts="W" data-tool="wall" title="Draw Wall (W)">
      <svg width="20" height="20"><use href="/icons.svg#icon-wall"></use></svg>
    </button>
    <button class="tool-btn" id="tool-token" aria-label="Place token" aria-pressed="false" aria-keyshortcuts="T" data-tool="token" title="Place Token (T)">
      <svg width="20" height="20"><use href="/icons.svg#icon-token"></use></svg>
    </button>
    <button class="tool-btn" id="tool-text" aria-label="Add label" aria-pressed="false" aria-keyshortcuts="L" data-tool="text" title="Add Label (L)">
      <svg width="20" height="20"><use href="/icons.svg#icon-label"></use></svg>
    </button>
    <button class="tool-btn" id="tool-erase" aria-label="Erase" aria-pressed="false" aria-keyshortcuts="E" data-tool="erase" title="Erase (E)">
      <svg width="20" height="20"><use href="/icons.svg#icon-erase"></use></svg>
    </button>
    <button class="tool-btn" id="tool-ruler" aria-label="Measure distance" aria-pressed="false" aria-keyshortcuts="M" data-tool="ruler" title="Measure (M)">
      <svg width="20" height="20"><use href="/icons.svg#icon-ruler"></use></svg>
    </button>
  </div>
