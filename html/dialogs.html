  <!-- Confirm dialog -->
  <div id="modal-overlay" class="hidden">
    <div id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-message">
      <p id="modal-message">Are you sure?</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Asked once, before joining or sharing, when there is no name yet (see src/ui/name-dialog.ts). No skip, no Escape. -->
  <div id="name-overlay" class="hidden">
    <div id="name-dialog" role="dialog" aria-modal="true" aria-labelledby="name-title" aria-describedby="name-note">
      <h2 id="name-title">Who's at the table?</h2>
      <p id="name-note">Others in the map see this name by your cursor. You can change it later in Settings.</p>
      <form id="name-form" novalidate>
        <div class="name-row">
          <input type="text" id="name-input" maxlength="40" aria-label="Your name" autocomplete="off" spellcheck="false" />
          <button type="button" class="icon-btn" id="name-shuffle" aria-label="Suggest another name" title="Suggest another name">
            <svg width="18" height="18"><use href="/icons.svg#icon-shuffle"></use></svg>
          </button>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary" id="name-join">Continue</button>
        </div>
      </form>
    </div>
  </div>
