  <!-- Context menu -->
  <div id="context-menu" class="hidden">
    <div class="ctx-item hidden" id="ctx-edit-text">
      <span class="ctx-label"><span class="ctx-icon">✏</span> Edit Text</span>
      <span class="ctx-shortcut">Enter</span>
    </div>
    <div class="ctx-item" id="ctx-copy">
      <span class="ctx-label"><span class="ctx-icon">❏</span> Copy</span>
      <span class="ctx-shortcut">Ctrl+C</span>
    </div>
    <div class="ctx-item" id="ctx-duplicate">
      <span class="ctx-label"><span class="ctx-icon">⧉</span> Duplicate</span>
      <span class="ctx-shortcut">Ctrl+D</span>
    </div>
    <div class="ctx-item" id="ctx-delete">
      <span class="ctx-label"><span class="ctx-icon">⌫</span> Delete</span>
      <span class="ctx-shortcut">Del</span>
    </div>
    <div class="ctx-divider"></div>
    <div class="ctx-item" id="ctx-bring-front">↑ Bring to Front</div>
    <div class="ctx-item" id="ctx-send-back">↓ Send to Back</div>
    <div class="ctx-divider"></div>
    <div class="ctx-item" id="ctx-lock">
      <span class="ctx-label"><span class="ctx-icon"><svg width="14" height="14" aria-hidden="true"><use href="/icons.svg#icon-lock"></use></svg></span> <span class="ctx-text">Lock</span></span>
    </div>
  </div>

  <!-- Canvas context menu (right-click on empty space) -->
  <div id="canvas-context-menu" class="hidden">
    <div class="ctx-item" id="ctx-paste">
      <span class="ctx-label"><span class="ctx-icon">❏</span> Paste</span>
      <span class="ctx-shortcut">Ctrl+V</span>
    </div>
    <div class="ctx-divider" id="ctx-paste-divider"></div>
    <!-- The map's background: a picture and a colour (see src/ui/background.ts) -->
    <div class="ctx-item" id="ctx-bg-add">
      <span class="ctx-label"><span class="ctx-icon"><svg width="14" height="14" aria-hidden="true"><use href="/icons.svg#icon-image"></use></svg></span> <span class="ctx-text">Add image…</span></span>
    </div>
    <div class="ctx-item" id="ctx-bg-adjust">
      <span class="ctx-label"><span class="ctx-icon">⤢</span> Adjust image</span>
    </div>
    <div class="ctx-item" id="ctx-bg-remove">
      <span class="ctx-label"><span class="ctx-icon">⌫</span> Remove image</span>
    </div>
    <div class="ctx-divider"></div>
    <div class="ctx-colors-label" id="ctx-bg-colors-label">Background color</div>
    <div class="ctx-colors" id="ctx-bg-colors" role="group" aria-labelledby="ctx-bg-colors-label">
      <label class="ctx-swatch ctx-swatch-custom" title="Custom color">
        <input type="color" id="ctx-bg-color-custom" aria-label="Custom background color" />
      </label>
    </div>
    <input type="file" id="bg-file" accept="image/png,image/jpeg,image/webp" hidden />
  </div>

  <!-- The token menu's "Conditions" submenu: every condition, ticked if the token has it (built in src/ui/context-menu.ts) -->
  <div id="token-conditions-menu" class="hidden" role="menu" aria-label="Conditions" tabindex="0"></div>

  <!-- Token context menu -->
  <div id="token-context-menu" class="hidden">
    <div class="ctx-item ctx-danger" id="ctx-token-delete">🗑 Remove Token</div>
    <div class="ctx-item" id="ctx-token-rename">✏ Rename</div>
    <div class="ctx-item" id="ctx-token-color">🎨 Change Color</div>
    <div class="ctx-item ctx-submenu-row" id="ctx-token-conditions">
      <span class="ctx-label"><span class="ctx-icon">⚑</span> Conditions</span>
      <span class="ctx-shortcut">›</span>
    </div>
    <div class="ctx-item" id="ctx-token-duplicate">
      <span class="ctx-label"><span class="ctx-icon">⧉</span> Duplicate</span>
      <span class="ctx-shortcut">Ctrl+D</span>
    </div>
    <div class="ctx-item" id="ctx-token-lock">
      <span class="ctx-label"><span class="ctx-icon"><svg width="14" height="14" aria-hidden="true"><use href="/icons.svg#icon-lock"></use></svg></span> <span class="ctx-text">Lock</span></span>
    </div>
  </div>
