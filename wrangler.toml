name = "inkstone"
main = "party/server.js"
compatibility_date = "2025-07-18"

# Set CURSORS_OFF to "1" to switch the live cursors off when the free plan's daily limits run low: the
# map keeps working, and clients stop asking for cursors. Changing it in the Cloudflare dashboard takes
# effect at once, but the next `wrangler deploy` puts this value back.
[vars]
CURSORS_OFF = "0"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "InkstoneRoom"

[[durable_objects.bindings]]
name = "CURSORS"
class_name = "CursorRoom"

# Counts what each visitor has sent through the feedback form, so it can't be used to flood the channel (party/feedback.js).
[[durable_objects.bindings]]
name = "FEEDBACK_GATE"
class_name = "FeedbackGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InkstoneRoom", "CursorRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FeedbackGate"]

# The feedback form posts to a Discord channel through a webhook, whose address is a secret and not in this file:
#   npx wrangler secret put FEEDBACK_WEBHOOK
# (Discord: a private channel, Edit Channel, Integrations, Webhooks, New Webhook, Copy Webhook URL.)
# Without it the form says feedback isn't set up.
