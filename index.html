<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkstone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient brand mark, faded, non-interactive -->
  <div id="brand-mark">
    <img id="brand-icon" src="/logo.svg" alt="" width="26" height="26" />
    <span>Inkstone</span>
  </div>

  <!-- Action cluster: undo/redo/view controls, top-right -->
  <div id="action-cluster" class="floating-panel">
    <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)">
      <svg width="18" height="18"><use href="/icons.svg#icon-undo"></use></svg>
    </button>
    <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)">
      <svg width="18" height="18"><use href="/icons.svg#icon-redo"></use></svg>
    </button>
    <div class="panel-divider"></div>
    <button class="icon-btn" id="btn-reset-view" title="Reset view (Home)">
      <svg width="18" height="18"><use href="/icons.svg#icon-reset-view"></use></svg>
    </button>
    <button class="icon-btn" id="btn-clear" title="Clear all elements">
      <svg width="18" height="18"><use href="/icons.svg#icon-clear"></use></svg>
    </button>
    <button class="icon-btn" id="btn-export" title="Export as PNG">
      <svg width="18" height="18"><use href="/icons.svg#icon-export"></use></svg>
    </button>
    <div class="panel-divider"></div>
    <button class="icon-btn" id="btn-share" title="Share this map (live co-editing)">
      <svg width="18" height="18"><use href="/icons.svg#icon-share"></use></svg>
    </button>
  </div>

  <!-- Style controls: contextual, appears above the tool dock for tools that use stroke/fill -->
  <div id="style-panel" class="floating-panel hidden">
    <div class="style-group" id="style-group-stroke">
      <span class="style-tag">Stroke</span>
      <div class="color-swatches" id="stroke-swatches">
        <button class="swatch active" data-color="#e8dcc8" style="background:#e8dcc8" title="Parchment"></button>
        <button class="swatch" data-color="#8b5e3c" style="background:#8b5e3c" title="Brown"></button>
        <button class="swatch" data-color="#4a7c59" style="background:#4a7c59" title="Forest"></button>
        <button class="swatch" data-color="#5b7fa6" style="background:#5b7fa6" title="Water"></button>
        <button class="swatch" data-color="#c9a84c" style="background:#c9a84c" title="Gold"></button>
        <button class="swatch" data-color="#a04040" style="background:#a04040" title="Blood"></button>
        <button class="swatch swatch-add" id="stroke-custom-add" title="Custom color"><svg width="10" height="10"><use href="/icons.svg#icon-plus"></use></svg></button>
      </div>
    </div>

    <div class="panel-divider" id="style-divider-width"></div>
    <div class="style-group" id="style-group-width">
      <span class="style-tag">Size</span>
      <input type="range" id="stroke-width" min="1" max="20" value="4" class="slider" />
      <span id="stroke-width-val">4</span>
    </div>

    <div class="panel-divider" id="style-divider-fill"></div>
    <div class="style-group" id="style-group-fill">
      <span class="style-tag">Fill</span>
      <div class="color-swatches" id="fill-swatches">
        <button class="swatch" data-color="transparent" style="background:transparent;border:1px dashed #666" title="None"></button>
        <button class="swatch" data-color="#433b31" style="background:#433b31" title="Dark"></button>
        <button class="swatch" data-color="#564837" style="background:#564837" title="Dungeon"></button>
        <button class="swatch" data-color="#364c3f" style="background:#364c3f" title="Forest"></button>
        <button class="swatch" data-color="#333e4e" style="background:#333e4e" title="Water"></button>
        <button class="swatch active" data-color="#463b29" style="background:#463b29" title="Earth"></button>
        <button class="swatch swatch-add" id="fill-custom-add" title="Custom color"><svg width="10" height="10"><use href="/icons.svg#icon-plus"></use></svg></button>
      </div>
    </div>

    <div class="panel-divider" id="style-divider-preview"></div>
    <div class="style-group" id="style-group-preview">
      <span class="style-tag">Preview</span>
      <span id="label-preview-text">Label</span>
    </div>
  </div>

  <!-- Tool dock, bottom-center -->
  <div id="tool-dock" class="floating-panel">
    <button class="tool-btn active" id="tool-select" data-tool="select" title="Select & Move (V)">
      <svg width="20" height="20"><use href="/icons.svg#icon-select"></use></svg>
    </button>
    <button class="tool-btn" id="tool-rect" data-tool="rect" title="Rectangle Room (R)">
      <svg width="20" height="20"><use href="/icons.svg#icon-room"></use></svg>
    </button>
    <button class="tool-btn" id="tool-wall" data-tool="wall" title="Draw Wall (W)">
      <svg width="20" height="20"><use href="/icons.svg#icon-wall"></use></svg>
    </button>
    <button class="tool-btn" id="tool-token" data-tool="token" title="Place Token (T)">
      <svg width="20" height="20"><use href="/icons.svg#icon-token"></use></svg>
    </button>
    <button class="tool-btn" id="tool-text" data-tool="text" title="Add Label (L)">
      <svg width="20" height="20"><use href="/icons.svg#icon-label"></use></svg>
    </button>
    <button class="tool-btn" id="tool-erase" data-tool="erase" title="Erase (E)">
      <svg width="20" height="20"><use href="/icons.svg#icon-erase"></use></svg>
    </button>
  </div>

  <!-- Ambient HUD readout, faded, non-interactive -->
  <div id="hud-meta">
    <div id="hud-coords">
      <span id="cursor-pos">0, 0</span>
      <span id="zoom-label">100%</span>
      <span id="collab-status" class="hidden">● Live</span>
    </div>
    <span id="version-label"></span>
  </div>

  <!-- Canvas container -->
  <main id="canvas-container">
    <canvas id="grid-canvas"></canvas>
    <canvas id="main-canvas"></canvas>
    <canvas id="interaction-canvas"></canvas>
  </main>

  <!-- Context menu -->
  <div id="context-menu" class="hidden">
    <div class="ctx-item" id="ctx-copy">
      <span class="ctx-label"><span class="ctx-icon">❏</span> Copy</span>
      <span class="ctx-shortcut">Ctrl+C</span>
    </div>
    <div class="ctx-item" id="ctx-duplicate">
      <span class="ctx-label"><span class="ctx-icon">⧉</span> Duplicate</span>
      <span class="ctx-shortcut">Ctrl+D</span>
    </div>
    <div class="ctx-item" id="ctx-delete">
      <span class="ctx-label"><span class="ctx-icon">⌫</span> Delete</span>
      <span class="ctx-shortcut">Del</span>
    </div>
    <div class="ctx-divider"></div>
    <div class="ctx-item" id="ctx-bring-front">↑ Bring to Front</div>
    <div class="ctx-item" id="ctx-send-back">↓ Send to Back</div>
  </div>

  <!-- Canvas context menu (right-click on empty space) -->
  <div id="canvas-context-menu" class="hidden">
    <div class="ctx-item" id="ctx-paste">
      <span class="ctx-label"><span class="ctx-icon">❏</span> Paste</span>
      <span class="ctx-shortcut">Ctrl+V</span>
    </div>
  </div>

  <!-- Token context menu -->
  <div id="token-context-menu" class="hidden">
    <div class="ctx-item ctx-danger" id="ctx-token-delete">🗑 Remove Token</div>
    <div class="ctx-item" id="ctx-token-rename">✏ Rename</div>
    <div class="ctx-item" id="ctx-token-color">🎨 Change Color</div>
  </div>

  <!-- Confirm dialog -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <p id="modal-message">Are you sure?</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Token name dialog -->
  <div id="token-name-overlay" class="hidden">
    <div id="token-name-modal">
      <p>Name this token</p>
      <input type="text" id="token-name-input" placeholder="e.g. Aragorn" maxlength="20" />
      <div class="modal-actions">
        <button id="token-name-cancel" class="btn-secondary">Cancel</button>
        <button id="token-name-confirm" class="btn-primary">Place Token</button>
      </div>
    </div>
  </div>

  <!-- Text label dialog -->
  <div id="text-label-overlay" class="hidden">
    <div id="text-label-modal">
      <p>Enter label text</p>
      <input type="text" id="text-label-input" placeholder="e.g. Throne Room" maxlength="40" />
      <div class="modal-actions">
        <button id="text-label-cancel" class="btn-secondary">Cancel</button>
        <button id="text-label-confirm" class="btn-primary">Add Label</button>
      </div>
    </div>
  </div>

  <!-- Custom color popovers (opened from the "+" swatch) -->
  <div id="stroke-color-popover" class="color-popover hidden">
    <div class="color-popover-label">Previously picked</div>
    <div class="color-popover-swatches"></div>
    <button class="color-popover-new">New color…</button>
  </div>
  <div id="fill-color-popover" class="color-popover hidden">
    <div class="color-popover-label">Previously picked</div>
    <div class="color-popover-swatches"></div>
    <button class="color-popover-new">New color…</button>
  </div>

  <div id="toast"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
