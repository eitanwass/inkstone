<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tavern Map</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Toolbar -->
  <aside id="toolbar">
    <div id="toolbar-logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <polygon points="14,2 26,22 2,22" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
        <circle cx="14" cy="14" r="4" fill="#c9a84c" opacity="0.7"/>
      </svg>
      <span>Tavern Map</span>
    </div>

    <div class="tool-group" id="tool-group-main">
      <div class="tool-label">TOOLS</div>

      <button class="tool-btn active" id="tool-select" data-tool="select" title="Select & Move (V)">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 2l12 8-6 1-3 6z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
        <span>Select</span>
        <kbd>V</kbd>
      </button>

      <button class="tool-btn" id="tool-rect" data-tool="rect" title="Rectangle Room (R)">
        <svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" stroke="currentColor" stroke-width="1.4" fill="none" rx="1"/></svg>
        <span>Room</span>
        <kbd>R</kbd>
      </button>

      <button class="tool-btn" id="tool-wall" data-tool="wall" title="Draw Wall (W)">
        <svg width="20" height="20" viewBox="0 0 20 20"><line x1="3" y1="17" x2="17" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Wall</span>
        <kbd>W</kbd>
      </button>

      <button class="tool-btn" id="tool-token" data-tool="token" title="Place Token (T)">
        <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.4" fill="none"/><circle cx="10" cy="10" r="2.5" fill="currentColor" opacity="0.5"/></svg>
        <span>Token</span>
        <kbd>T</kbd>
      </button>

      <button class="tool-btn" id="tool-door" data-tool="door" title="Place Door (D)">
        <svg width="20" height="20" viewBox="0 0 20 20"><rect x="5" y="4" width="10" height="13" stroke="currentColor" stroke-width="1.4" fill="none" rx="0.5"/><circle cx="13.5" cy="10.5" r="1" fill="currentColor"/><path d="M5 17 Q10 11 15 17" stroke="currentColor" stroke-width="1" fill="none" opacity="0.6"/></svg>
        <span>Door</span>
        <kbd>D</kbd>
      </button>

      <button class="tool-btn" id="tool-text" data-tool="text" title="Add Label (L)">
        <svg width="20" height="20" viewBox="0 0 20 20"><text x="4" y="15" font-size="13" fill="currentColor" font-family="serif" font-weight="bold">A</text></svg>
        <span>Label</span>
        <kbd>L</kbd>
      </button>

      <button class="tool-btn" id="tool-erase" data-tool="erase" title="Erase (E)">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M14 3l3 3-9 11H5v-3z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><line x1="11" y1="6" x2="14" y2="9" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>Erase</span>
        <kbd>E</kbd>
      </button>
    </div>

    <div class="tool-group">
      <div class="tool-label">STYLE</div>

      <div class="style-row">
        <span class="style-lbl">Stroke</span>
        <div class="color-swatches" id="stroke-swatches">
          <button class="swatch active" data-color="#e8dcc8" style="background:#e8dcc8" title="Parchment"></button>
          <button class="swatch" data-color="#8b5e3c" style="background:#8b5e3c" title="Brown"></button>
          <button class="swatch" data-color="#4a7c59" style="background:#4a7c59" title="Forest"></button>
          <button class="swatch" data-color="#5b7fa6" style="background:#5b7fa6" title="Water"></button>
          <button class="swatch" data-color="#c9a84c" style="background:#c9a84c" title="Gold"></button>
          <button class="swatch" data-color="#a04040" style="background:#a04040" title="Blood"></button>
        </div>
      </div>

      <div class="style-row style-row-slider">
        <span class="style-lbl">Size</span>
        <input type="range" id="stroke-width" min="1" max="8" value="2" class="slider" />
        <span id="stroke-width-val">2</span>
      </div>

      <div class="style-row">
        <span class="style-lbl">Fill</span>
        <div class="color-swatches" id="fill-swatches">
          <button class="swatch active" data-color="transparent" style="background:transparent;border:1px dashed #666" title="None"></button>
          <button class="swatch" data-color="#2a2218" style="background:#2a2218" title="Dark"></button>
          <button class="swatch" data-color="#3d2f1e" style="background:#3d2f1e" title="Dungeon"></button>
          <button class="swatch" data-color="#1d3326" style="background:#1d3326" title="Forest"></button>
          <button class="swatch" data-color="#1a2535" style="background:#1a2535" title="Water"></button>
          <button class="swatch" data-color="#2d2210" style="background:#2d2210" title="Earth"></button>
        </div>
      </div>
    </div>

    <div class="tool-group">
      <div class="tool-label">VIEW</div>
      <button class="action-btn" id="btn-reset-view" title="Reset view to origin">Reset View</button>
      <button class="action-btn" id="btn-clear" title="Clear all elements">Clear All</button>
      <button class="action-btn" id="btn-export" title="Export as PNG">Export PNG</button>
    </div>

    <div id="toolbar-footer">
      <span id="cursor-pos">0, 0</span>
      <span id="zoom-label">100%</span>
    </div>
  </aside>

  <!-- Canvas container -->
  <main id="canvas-container">
    <canvas id="grid-canvas"></canvas>
    <canvas id="main-canvas"></canvas>
    <canvas id="interaction-canvas"></canvas>
  </main>

  <!-- Context menu -->
  <div id="context-menu" class="hidden">
    <div class="ctx-item" id="ctx-delete">🗑 Delete</div>
    <div class="ctx-item" id="ctx-bring-front">↑ Bring to Front</div>
    <div class="ctx-item" id="ctx-send-back">↓ Send to Back</div>
    <div class="ctx-divider"></div>
    <div class="ctx-item" id="ctx-duplicate">⧉ Duplicate</div>
  </div>

  <!-- Token context menu -->
  <div id="token-context-menu" class="hidden">
    <div class="ctx-item ctx-danger" id="ctx-token-delete">🗑 Remove Token</div>
    <div class="ctx-item" id="ctx-token-rename">✏ Rename</div>
    <div class="ctx-item" id="ctx-token-color">🎨 Change Color</div>
  </div>

  <!-- Confirm dialog -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <p id="modal-message">Are you sure?</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Token name dialog -->
  <div id="token-name-overlay" class="hidden">
    <div id="token-name-modal">
      <p>Name this token</p>
      <input type="text" id="token-name-input" placeholder="e.g. Aragorn" maxlength="20" />
      <div class="modal-actions">
        <button id="token-name-cancel" class="btn-secondary">Cancel</button>
        <button id="token-name-confirm" class="btn-primary">Place Token</button>
      </div>
    </div>
  </div>

  <!-- Text label dialog -->
  <div id="text-label-overlay" class="hidden">
    <div id="text-label-modal">
      <p>Enter label text</p>
      <input type="text" id="text-label-input" placeholder="e.g. Throne Room" maxlength="40" />
      <div class="modal-actions">
        <button id="text-label-cancel" class="btn-secondary">Cancel</button>
        <button id="text-label-confirm" class="btn-primary">Add Label</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
