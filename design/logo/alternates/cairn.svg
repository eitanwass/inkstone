  <ellipse cx="31" cy="34" rx="15" ry="8" fill="#a89885" stroke="#1a1714" stroke-width="1.500"/>
  <ellipse cx="33.500" cy="22.500" rx="10" ry="7" fill="#f5ecd0" stroke="#1a1714" stroke-width="1.500"/>
</svg>
