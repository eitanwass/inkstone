<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- The full mark: used in the app's corner and anywhere there is room.
       Chamfered tile, the same cut corners as the app's panels. -->
  <polygon points="9,0 55,0 64,9 64,55 55,64 9,64 0,55 0,9" fill="#1a1714"/>
  <!-- A compass bezel: a thin ring with a tick at each cardinal point -->
  <circle cx="32" cy="32" r="25" stroke="#a89885" stroke-width="1.5" opacity="0.7"/>
  <path d="M32 4.5v5M32 54.5v5M4.5 32h5M54.5 32h5" stroke="#a89885" stroke-width="1.5" opacity="0.7"/>
  <!-- A pen nib that is also a compass needle: ink, pointing north. Two tones, like a needle. -->
  <path d="M32 11c4 10 10 19 10 29l-4 11H26l-4-11c0-10 6-19 10-29z" fill="#c9a84c"/>
  <path d="M32 11c4 10 10 19 10 29l-4 11h-6z" fill="#8a6a28"/>
  <!-- The nib's slit and breather hole -->
  <path d="M32 36v15" stroke="#1a1714" stroke-width="2"/>
  <circle cx="32" cy="34" r="3.4" fill="#1a1714"/>
</svg>
